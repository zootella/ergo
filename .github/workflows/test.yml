# every edition runs its own tests with its own tool, then the javascript suite drives all four editions together
name: test

on:
  push:
    branches: ['**'] # every branch and no tag, since the publish workflow runs this whole suite itself on the tag it publishes
  pull_request:
  workflow_call: # so the publish workflow runs this whole suite before it publishes anything

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: javascript/pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.0 # setup-uv publishes exact versions only, with no tag that follows a major
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum # which holds lukechampine.com/blake3 and the cpuid package it uses

      - name: go
        working-directory: go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: rust
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets --features driver -- -D warnings
          cargo test

      - name: python
        working-directory: python
        run: |
          uv sync
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest

      - name: javascript, and every edition together
        working-directory: javascript
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm exec prettier --check ../release.js # release.js belongs to no edition, and the configuration at the root formats it the same way
          pnpm test
