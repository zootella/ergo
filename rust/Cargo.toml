[package]
name = "zootella-ergo"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Simple, dependency-free helper functions, the same in JavaScript, Python, Rust, and Go."
license = "MIT"
homepage = "https://zootella.com"
repository = "https://github.com/zootella/ergo"
readme = "README.md"
keywords = ["helpers", "size", "time", "constants", "ergonomic"]
categories = ["value-formatting", "date-and-time"]
exclude = ["tests/"] # the vector reader needs the shared tests directory beside this crate in the repository, which a published crate doesn't have

[dependencies]
getrandom = "0.4" # the operating system's random source, which the standard library doesn't expose yet; the crate the ecosystem's randomness rests on
serde_json = { version = "1", optional = true }

[features]
driver = ["dep:serde_json"]

# the crate depends on itself here to turn the driver feature on for tests alone, so cargo test builds the dispatch table without making serde_json a dependency of the library
[dev-dependencies]
zootella-ergo = { path = ".", features = ["driver"] }

[[bin]]
name = "driver"
required-features = ["driver"]
