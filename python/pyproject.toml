[project]
name = "zootella-ergo"
version = "0.1.1"
description = "Simple, dependency-free helper functions, the same in JavaScript, Python, Rust, and Go."
readme = "README.md"
license = "MIT"
authors = [{ name = "zootella", email = "zootella@zootella.com" }]
requires-python = ">=3.12"
dependencies = []
keywords = ["helpers", "size", "time", "constants"]

[project.urls]
Homepage = "https://zootella.com"
Repository = "https://github.com/zootella/ergo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zootella"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests", "src"]
pythonpath = ["src"]
